name: CI

on:
  push:
    branches:
      - ci/platform-version-matrix
      - main
  pull_request:
    branches:
      - "**"
  schedule:
    - cron: "3 3 * * 2" # 3:03 AM, every Tuesday

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Mise tools
        uses: jdx/mise-action@v3

      - name: SwiftFormat Lint
        run: hk check --all

  apple:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.title, '[skip ci]')
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner || 'macos-26' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One representative simulator runtime per supported OS major.
          - { name: "iOS 16.4", runtime: "iOS 16.4", device: "iPhone 14 Pro" }
          - { name: "iOS 17.5", runtime: "iOS 17.5", device: "iPhone 15 Pro" }
          - { name: "iOS 18.5", runtime: "iOS 18.5", device: "iPhone 16 Pro" }
          - { name: "iOS 26.5", runtime: "iOS 26.5", device: "iPhone 17 Pro" }
          - { name: "iPadOS 16.4", runtime: "iOS 16.4", device: "iPad Pro (11-inch) (4th generation)" }
          - { name: "iPadOS 17.5", runtime: "iOS 17.5", device: "iPad Pro 11-inch (M4)" }
          - { name: "iPadOS 18.5", runtime: "iOS 18.5", device: "iPad Pro 11-inch (M4)" }
          - { name: "iPadOS 26.5", runtime: "iOS 26.5", device: "iPad Pro 11-inch (M5)" }
          # Catalyst runs on the host OS. CI covers macOS 15 and 26 hosts.
          # Older hosts are not covered. The package requires Swift 6.2.
          - { name: "macCatalyst 15", destination: "platform=macOS,variant=Mac Catalyst", runner: macos-15, xcode: "26.3" }
          - { name: "macCatalyst 26", destination: "platform=macOS,variant=Mac Catalyst" }
          - { name: "tvOS 16.4", runtime: "tvOS 16.4", device: "Apple TV" }
          - { name: "tvOS 17.5", runtime: "tvOS 17.5", device: "Apple TV" }
          - { name: "tvOS 18.5", runtime: "tvOS 18.5", device: "Apple TV" }
          - { name: "tvOS 26.5", runtime: "tvOS 26.5", device: "Apple TV" }
          - { name: "visionOS 1.2", runtime: "visionOS 1.2", device: "Apple Vision Pro (at 2732x2048)" }
          - { name: "visionOS 2.5", runtime: "visionOS 2.5", device: "Apple Vision Pro (at 2732x2048)" }
          - { name: "visionOS 26.4", runtime: "visionOS 26.4", device: "Apple Vision Pro" }
    steps:
      - name: Git Checkout
        uses: actions/checkout@v5

      - name: Allow Macros
        run: |
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Install xcodes
        run: |
          brew uninstall xcodes
          brew install xcodesorg/made/xcodes

      - name: Select Xcode
        run: sudo xcodes select ${{ matrix.xcode || '26.6' }}

      - name: Install ${{ matrix.runtime }} Runtime
        if: matrix.runtime
        uses: nick-fields/retry@v3
        env:
          RUNTIME: ${{ matrix.runtime }}
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: |
            set -eo pipefail
            if xcrun simctl list runtimes -j | jq -e --arg name "$RUNTIME" '.runtimes[] | select(.isAvailable and .name == $name)' >/dev/null; then
              echo "Runtime '$RUNTIME' is already installed."
            else
              sudo xcodes runtimes install "$RUNTIME" --aria2 "$(command -v aria2c)"
            fi

      - name: Create Simulator
        if: matrix.device
        env:
          DEVICE: ${{ matrix.device }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          set -eo pipefail
          xcrun simctl delete all
          RUNTIME_ID=$(xcrun simctl list runtimes -j | jq -er --arg name "$RUNTIME" '[.runtimes[] | select(.isAvailable and .name == $name) | .identifier] | if length == 1 then .[0] else error("Expected one available runtime: " + $name) end')
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | jq -er --arg name "$DEVICE" '[.devicetypes[] | select(.name == $name) | .identifier] | if length == 1 then .[0] else error("Expected one device type: " + $name) end')
          SIM_UDID=$(xcrun simctl create "$DEVICE" "$DEVICE_TYPE" "$RUNTIME_ID")
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          echo "Created simulator: $DEVICE ($RUNTIME) -> $SIM_UDID"

      - name: Run Tests
        env:
          DESTINATION: ${{ matrix.destination || format('id={0}', env.SIM_UDID) }}
        run: |
          set -eo pipefail
          mkdir -p artifacts
          SIGNING_ARGS=()
          if [[ "$DESTINATION" == "platform=macOS,variant=Mac Catalyst" ]]; then
            SIGNING_ARGS+=(CODE_SIGN_IDENTITY=-)
          fi
          xcodebuild test \
            -workspace SwiftUINavigationTransitions.xcworkspace \
            -scheme SwiftUINavigationTransitions \
            -destination "$DESTINATION" \
            -configuration Debug \
            -resultBundlePath artifacts/Tests.xcresult \
            "${SIGNING_ARGS[@]}" \
            | tee artifacts/tests.log | xcbeautify

      - name: Build Demo
        env:
          DESTINATION: ${{ matrix.destination || format('id={0}', env.SIM_UDID) }}
        run: |
          set -eo pipefail
          SIGNING_ARGS=()
          if [[ "$DESTINATION" == "platform=macOS,variant=Mac Catalyst" ]]; then
            SIGNING_ARGS+=(CODE_SIGN_IDENTITY=-)
          fi
          xcodebuild build \
            -workspace SwiftUINavigationTransitions.xcworkspace \
            -scheme Demo \
            -destination "$DESTINATION" \
            -configuration Debug \
            "${SIGNING_ARGS[@]}" \
            | tee artifacts/demo.log | xcbeautify

      - name: Upload Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-failure
          path: artifacts
          if-no-files-found: ignore
