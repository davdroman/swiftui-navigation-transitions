name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  schedule:
    - cron: "3 3 * * 2" # 3:03 AM, every Tuesday

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Mise tools
        uses: jdx/mise-action@v3

      - name: SwiftFormat Lint
        run: hk check --all

  apple:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.title, '[skip ci]')
    name: ${{ matrix.platform }}${{ matrix.runtime != 'latest' && format(' {0}', matrix.runtime) || '' }} (Swift ${{ matrix.swift }})
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        platform:
          - iOS
          - mac-catalyst
          - tvOS
          - visionOS
        runtime:
          - latest
        swift:
          - "6.4"
        include:
          # Before iOS 26, the library sets up its own pop gesture recognizers.
          - platform: iOS
            runtime: "18.6"
            swift: "6.4"
    steps:
      - name: Git Checkout
        uses: actions/checkout@v5

      - name: Allow Macros
        run: |
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Select Xcode version
        uses: mxcl/xcodebuild@v3
        with:
          swift: ~${{ matrix.swift }}
          action: none
          verbosity: xcbeautify

      - if: ${{ matrix.platform != 'mac-catalyst' }}
        name: Initialize Simulator Service
        run: xcrun simctl list

      - if: ${{ matrix.platform != 'mac-catalyst' && matrix.runtime == 'latest' }}
        name: Download Runtime
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: xcodebuild -downloadPlatform ${{ matrix.platform }}

      # Xcode only downloads the runtimes of its own OS versions.
      - if: ${{ matrix.runtime != 'latest' }}
        name: Install xcodes
        run: |
          brew uninstall xcodes || true
          brew install xcodesorg/made/xcodes

      - if: ${{ matrix.runtime != 'latest' }}
        name: Install ${{ matrix.platform }} ${{ matrix.runtime }} Runtime
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: sudo xcodes runtimes install "${{ matrix.platform }} ${{ matrix.runtime }}"

      - name: Run Tests
        uses: mxcl/xcodebuild@v3
        with:
          platform: ${{ matrix.platform }}
          platform-version: ${{ matrix.runtime != 'latest' && format('~{0}', matrix.runtime) || '' }}
          swift: ~${{ matrix.swift }}
          action: test
          workspace: SwiftUINavigationTransitions.xcworkspace
          scheme: SwiftUINavigationTransitions
          verbosity: xcbeautify

      # Each test run writes the same result bundle path.
      - name: Remove Test Results
        run: rm -rf test.xcresult

      # The demo's UI tests swipe back through it on iOS. Other platforms build it.
      - name: ${{ matrix.platform == 'iOS' && 'Test' || 'Build' }} Demo
        uses: mxcl/xcodebuild@v3
        with:
          platform: ${{ matrix.platform }}
          platform-version: ${{ matrix.runtime != 'latest' && format('~{0}', matrix.runtime) || '' }}
          swift: ~${{ matrix.swift }}
          action: ${{ matrix.platform == 'iOS' && 'test' || 'build' }}
          workspace: SwiftUINavigationTransitions.xcworkspace
          scheme: Demo
          verbosity: xcbeautify
